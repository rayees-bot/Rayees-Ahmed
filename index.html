<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>MediQuick — Every Medicine. One Platform.</title>
    <meta
      name="description"
      content="Every Medicine. One Platform. Instant normal and rare medicine discovery, cart, direct ordering, Razorpay/COD checkout, nearby pharmacy locator, and live delivery tracking."
    />
    <meta property="og:title" content="MediQuick — Every Medicine. One Platform." />
    <meta
      property="og:description"
      content="Every Medicine. One Platform. Order normal and rare medicines directly from nearby pharmacies with live doorstep delivery tracking."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (window.location.protocol !== 'file:') return;

        var icons = document.querySelectorAll('link[rel*="icon"]');
        for (var i = 0; i < icons.length; i++) {
          icons[i].setAttribute('href', './favicon.ico');
        }

        function loadCss(candidates, idx) {
          if (idx >= candidates.length) return;
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = candidates[idx];
          link.onerror = function () {
            loadCss(candidates, idx + 1);
          };
          document.head.appendChild(link);
        }

        function showStandaloneFallback() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Plus Jakarta Sans,DM Sans,system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a">' +
              '<div style="max-width:480px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;box-shadow:0 12px 30px rgba(15,23,42,0.08)">' +
                '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">' +
                  '<img src="./favicon.ico" alt="MediQuick" style="width:40px;height:40px;border-radius:10px;object-fit:cover" onerror="this.style.display=\'none\'" />' +
                  '<div>' +
                    '<div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;color:#0f172a">MediQuick</div>' +
                    '<div style="font-size:13px;color:#0d9488;font-weight:600">Every Medicine. One Platform.</div>' +
                  '</div>' +
                '</div>' +
                '<p style="font-size:14px;line-height:1.6;color:#475569;margin:0 0 20px">' +
                  'Launch MediQuick in Chrome using the hosted web app or your local development server.' +
                '</p>' +
                '<div style="display:flex;flex-direction:column;gap:10px">' +
                  '<a href="https://ais-pre-h6junf2oeoeihup3qdthum-850615448518.asia-northeast1.run.app" style="display:block;text-align:center;background:#0d9488;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 16px;border-radius:10px">Open MediQuick Web App</a>' +
                  '<a href="http://localhost:3000" style="display:block;text-align:center;background:#f1f5f9;color:#0f172a;text-decoration:none;font-weight:600;font-size:14px;padding:12px 16px;border-radius:10px;border:1px solid #cbd5e1">Open Local Server (localhost:3000)</a>' +
                '</div>' +
                '<div style="margin-top:18px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;font-size:12px;color:#64748b">' +
                  'To run locally with backend &amp; Google Sign-In: run <code style="font-family:JetBrains Mono,monospace;color:#0f172a">npm install &amp;&amp; npm run dev</code> in the project folder.' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        function loadScript(candidates, idx) {
          if (idx >= candidates.length) {
            showStandaloneFallback();
            return;
          }
          var script = document.createElement('script');
          script.src = candidates[idx];
          script.onerror = function () {
            loadScript(candidates, idx + 1);
          };
          document.body.appendChild(script);
        }

        loadCss(['./public/standalone/mediquick.css', './standalone/mediquick.css'], 0);
        loadScript(['./public/standalone/mediquick.iife.js', './standalone/mediquick.iife.js'], 0);
      })();
    </script>
  </body>
</html>
